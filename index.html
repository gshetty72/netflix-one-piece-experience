<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONE PIECE | Netflix Fandom Experience</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #E50914;
      --red-hover: #F40612;
      --canvas: #141414;
      --surface-1: #1F1F1F;
      --surface-2: #2D2D2D;
      --border: #333333;
      --ink: #FFFFFF;
      --ink-muted: #A3A3A3;
      --green: #46D369;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--canvas);
      color: var(--ink);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: var(--surface-1); }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    /* Nav */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 60;
      height: 68px;
      display: flex; align-items: center; gap: 28px;
      padding: 0 4%;
      transition: background 0.35s ease;
    }
    #nav.scrolled { background: var(--canvas); }
    #nav.at-top { background: linear-gradient(to bottom, rgba(20,20,20,0.9), transparent); }
    .nav-logo {
      color: var(--red);
      font-size: 30px; font-weight: 900;
      letter-spacing: -0.04em; font-style: italic;
      flex-shrink: 0;
    }
    .nav-links { display: flex; gap: 18px; align-items: center; flex: 1; }
    .nav-links a {
      color: #ccc; text-decoration: none; font-size: 14px;
      transition: color 0.15s; white-space: nowrap;
    }
    .nav-links a:hover, .nav-links a.active { color: white; font-weight: 600; }
    .nav-right { display: flex; gap: 14px; align-items: center; }
    .nav-avatar {
      width: 32px; height: 32px; border-radius: 4px;
      background: #1565C0; color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .nav-icon { cursor: pointer; opacity: 0.85; }
    .nav-icon:hover { opacity: 1; }

    /* Buttons */
    .btn-play {
      background: white; color: black; border: none;
      padding: 10px 24px; border-radius: 4px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
      transition: background 0.15s; white-space: nowrap;
    }
    .btn-play:hover { background: rgba(255,255,255,0.85); }
    .btn-info {
      background: rgba(109,109,110,0.7); color: white; border: none;
      padding: 10px 24px; border-radius: 4px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
      transition: background 0.15s; white-space: nowrap;
    }
    .btn-info:hover { background: rgba(109,109,110,0.9); }

    /* Hero */
    #home {
      position: relative;
      min-height: 100dvh;
      display: flex; align-items: flex-end;
      padding-bottom: 10%;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background:
        url('hero-banner.jpg') center center / cover no-repeat;
      overflow: hidden;
    }
    .hero-overlay {
      position: absolute; inset: 0;
      background:
        linear-gradient(to right, rgba(10,10,10,0.62) 0%, rgba(10,10,10,0.32) 28%, rgba(10,10,10,0.06) 52%, transparent 68%),
        linear-gradient(to top, #141414 0%, rgba(20,20,20,0.9) 10%, rgba(20,20,20,0.4) 20%, rgba(20,20,20,0.08) 34%, transparent 48%);
    }
    /* Thin hard-seal at the section boundary to prevent any edge line */
    .hero-floor {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 72px;
      background: linear-gradient(to top, #141414 45%, transparent 100%);
      pointer-events: none;
    }
    .hero-content {
      position: relative; z-index: 1;
      padding: 0 4%; max-width: 580px;
    }
    .hero-eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.18em;
      color: var(--red); text-transform: uppercase;
      margin-bottom: 14px;
    }
    .hero-title {
      font-size: clamp(64px, 11vw, 108px);
      font-weight: 900; letter-spacing: -0.025em; line-height: 0.9;
      color: white; text-shadow: 2px 4px 20px rgba(0,0,0,0.7);
      margin-bottom: 20px;
    }
    .hero-desc {
      font-size: 16px; line-height: 1.65;
      color: rgba(255,255,255,0.85);
      max-width: 420px; margin-bottom: 28px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
    }
    .hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; }

    /* Section header */
    .section-title {
      font-size: 20px; font-weight: 600; color: white;
      margin-bottom: 16px; padding: 0 4%;
    }

    /* Watchlist row */
    #watchlist { padding: 8px 0 40px; }
    .watchlist-wrap { position: relative; }
    .watchlist-row {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 8px 4% 16px;
      align-items: flex-start;
    }
    .arrow-btn {
      position: absolute; top: 0; bottom: 0; z-index: 5;
      background: none; border: none; color: white;
      font-size: 28px; padding: 0 14px; cursor: pointer;
      display: flex; align-items: center;
      opacity: 0.8; transition: opacity 0.15s;
    }
    .arrow-btn:hover { opacity: 1; }
    .arrow-left {
      left: 0;
      background: linear-gradient(to right, rgba(20,20,20,0.95), transparent);
    }
    .arrow-right {
      right: 0;
      background: linear-gradient(to left, rgba(20,20,20,0.95), transparent);
    }
    .content-card {
      flex-shrink: 0; cursor: pointer; border-radius: 4px; overflow: hidden;
      transition: transform 0.22s ease, box-shadow 0.22s ease; position: relative;
    }
    .content-card:hover { transform: scale(1.08); box-shadow: 0 8px 32px rgba(0,0,0,0.8); z-index: 5; }
    /* Landscape 16:9 watchlist card */
    .card-img-wrap {
      width: 240px; height: 135px;
      background: var(--surface-2); position: relative; overflow: hidden;
    }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* Netflix N logo — top-left corner of card */
    .card-nlogo {
      position: absolute; top: 6px; left: 6px;
      height: 20px; width: auto; display: block;
    }
    /* Status badge — bottom-left, red strip */
    .card-status {
      position: absolute; bottom: 0; left: 0;
      background: var(--red); color: white;
      font-size: 10px; font-weight: 700;
      padding: 3px 8px;
      letter-spacing: 0.04em;
    }
    .card-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 12px; text-align: center;
    }
    .card-placeholder-icon { font-size: 28px; margin-bottom: 6px; }
    .card-placeholder-title { font-size: 11px; color: white; font-weight: 600; line-height: 1.3; }

    /* Wanted Poster */
    #characters { padding: 40px 0 20px; }
    .crew-row {
      display: flex; gap: 28px; overflow-x: auto;
      padding: 16px 4% 36px; align-items: flex-start;
    }
    .crew-item { flex-shrink: 0; text-align: center; }
    .crew-actor { margin-top: 14px; font-size: 12px; color: var(--ink-muted); }

    .wanted-poster {
      width: 180px;
      height: 252px;
      overflow: hidden;
      background: #141414;
      cursor: pointer;
      transform: rotate(var(--rot, 0deg));
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.85);
    }
    .wanted-poster:hover {
      transform: translateY(-10px) rotate(var(--rot, 0deg));
      box-shadow: 0 20px 48px rgba(0,0,0,0.92);
    }
    .wanted-poster img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .poster-placeholder {
      width: 100%; height: 100%; background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
    }


    /* Podcast */
    #podcast { padding: 40px 0; }
    .podcast-duration-badge {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.72); color: white;
      font-size: 11px; font-weight: 600;
      padding: 3px 8px; border-radius: 3px;
      letter-spacing: 0.02em;
    }
    .podcast-card-meta {
      padding: 8px 0 0; max-width: 240px;
    }
    .podcast-card-title {
      font-size: 13px; font-weight: 600; color: white;
      line-height: 1.3; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .podcast-card-sub {
      font-size: 12px; color: var(--ink-muted); margin-top: 3px;
    }

    /* More Like This */
    .mlt-section { margin-top: 32px; padding-bottom: 8px; }
    .mlt-title { font-size: 24px; font-weight: 500; color: white; margin-bottom: 22px; }
    .mlt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .mlt-card { background: #2f2f2f; border-radius: 4px; overflow: hidden; cursor: pointer; transition: transform 0.22s ease; }
    .mlt-card:hover { transform: scale(1.02); }
    .mlt-thumb { position: relative; height: 132px; background: #3a3a3a; overflow: hidden; }
    .mlt-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mlt-thumb-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .mlt-thumb-title { font-size: 18px; font-weight: 700; color: white; text-align: center; padding: 8px; }
    .mlt-nlogo { position: absolute; top: 7px; left: 7px; height: 20px; width: auto; display: block; }
    .mlt-seasons { position: absolute; top: 7px; right: 8px; font-size: 14px; color: white; white-space: nowrap; }
    .mlt-meta { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
    .mlt-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .mlt-rating { border: 1px solid #bcbcbc; color: #bcbcbc; font-size: 13px; padding: 2px 6px; }
    .mlt-hd { border: 1px solid #808080; color: #e5e5e5; font-size: 11px; padding: 2px 5px; border-radius: 3px; }
    .mlt-year { font-size: 14px; color: #bcbcbc; }
    .mlt-add-btn { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); background: transparent; color: white; font-size: 22px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: border-color 0.15s; }
    .mlt-add-btn:hover { border-color: white; }
    .mlt-desc { padding: 0 14px 16px; font-size: 14px; color: #d2d2d2; line-height: 20px; }

    /* Games */
    #games { padding: 40px 0 80px; }
    .games-grid { margin: 0 4%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .game-tile {
      position: relative; height: 200px; border-radius: 6px;
      overflow: hidden; cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .game-tile:hover { transform: scale(1.03); box-shadow: 0 12px 40px rgba(0,0,0,0.8); }
    .game-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .game-tile-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(10,10,10,0.75) 0%, rgba(10,10,10,0.3) 100%);
    }
    .game-tile-title {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .game-tile-title h3 {
      color: white; font-size: 20px; font-weight: 700;
      text-align: center; text-shadow: 0 2px 12px rgba(0,0,0,0.9);
      line-height: 1.3; max-width: 200px;
    }
    .game-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .game-placeholder-inner {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.78);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; overflow-y: auto;
      animation: fadeOverlay 0.2s ease;
    }
    @keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .proto-toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: #2a2a2a; color: var(--ink-muted); font-size: 13px;
      padding: 10px 20px; border-radius: 6px; white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6); z-index: 9999;
      animation: fadeOverlay 0.2s ease;
      border: 1px solid #3a3a3a;
    }
    .modal-card { animation: slideUp 0.3s cubic-bezier(0.16,1,0.3,1); }

    /* Character modal */
    .char-modal {
      background: #181818; border-radius: 8px;
      max-width: 860px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .char-modal::-webkit-scrollbar { display: none; }
    .char-modal-hero { position: relative; height: 320px; overflow: hidden; border-radius: 8px 8px 0 0; }
    .char-modal-hero img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
    .char-modal-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, #181818 0%, rgba(24,24,24,0.45) 55%, transparent 100%);
    }
    .modal-close {
      position: absolute; top: 14px; right: 14px;
      background: rgba(0,0,0,0.65); border: none; color: white;
      width: 36px; height: 36px; border-radius: 50%; font-size: 20px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; line-height: 1;
    }
    .modal-close:hover { background: rgba(0,0,0,0.85); }
    .char-name-overlay {
      position: absolute; bottom: 20px; left: 24px; right: 80px;
    }
    .char-name-overlay h2 { font-size: 26px; font-weight: 700; color: white; line-height: 1.1; }
    .char-modal-body { padding: 20px 24px 28px; }
    .char-modal-columns { display: grid; grid-template-columns: 1fr 220px; gap: 36px; margin-bottom: 28px; }
    .char-meta-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .char-meta-text { font-size: 13px; color: var(--ink-muted); }
    .char-meta-sep { font-size: 13px; color: #444; }
    .char-meta-pill { border: 1px solid var(--ink-muted); padding: 1px 7px; font-size: 11px; color: var(--ink-muted); border-radius: 3px; letter-spacing: 0.03em; }
    .char-desc { color: white; font-size: 15px; line-height: 1.7; margin-bottom: 18px; }
    .char-body-name { font-size: 22px; font-weight: 700; color: white; margin-bottom: 12px; }
    .char-info-item { font-size: 14px; line-height: 20px; color: white; margin-bottom: 14px; }
    .char-info-item:last-child { margin-bottom: 0; }
    .char-info-label { color: #777; }
    .intel-quote {
      border-left: 2px solid #333; padding-left: 14px;
      color: #a0a0a0; font-size: 14px; line-height: 1.65; font-style: italic; margin: 0;
    }
    .intel-report { margin-bottom: 24px; }
    .intel-report-header {
      font-size: 13px; font-weight: 600; color: var(--ink-muted);
      text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .intel-report-header span.line { display: inline-block; width: 18px; height: 1px; background: var(--ink-muted); }
    .intel-quote {
      border-left: 2px solid #333; padding-left: 16px;
      color: #d3d3d3; font-size: 14px; line-height: 1.65; font-style: italic;
    }
    .ep-list { display: flex; flex-direction: column; margin-top: 4px; }
    .ep-list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .ep-list-title { font-size: 24px; font-weight: 500; color: white; }
    .ep-list-show { font-size: 18px; color: white; font-weight: 400; }
    .ep-row {
      display: flex; align-items: center;
      padding: 30px 52px 30px 16px;
      border-bottom: 1px solid #404040;
      border-radius: 4px; cursor: pointer;
      transition: background 0.15s;
    }
    .ep-row:hover { background: rgba(255,255,255,0.06); }
    .ep-num { width: 51px; text-align: center; font-size: 24px; color: #dcdcdc; flex-shrink: 0; line-height: 30px; }
    .ep-thumb { width: 128px; height: 72px; border-radius: 2px; overflow: hidden; flex-shrink: 0; position: relative; background: #3a3a3a; }
    .ep-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ep-thumb-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .ep-info { flex: 1; padding-left: 16px; }
    .ep-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .ep-title { font-size: 16px; color: white; font-weight: 700; }
    .ep-dur { font-size: 16px; color: white; white-space: nowrap; flex-shrink: 0; }
    .ep-desc { font-size: 14px; color: #d2d2d2; line-height: 20px; }

    /* Quiz / Trivia modals */
    .game-modal {
      background: #181818; border-radius: 8px;
      max-width: 600px; width: 100%; padding: 40px;
      position: relative;
    }
    .close-x {
      position: absolute; top: 16px; right: 16px;
      background: transparent; border: none; color: var(--ink-muted);
      font-size: 24px; cursor: pointer; line-height: 1;
    }
    .close-x:hover { color: white; }

    /* Devil Fruit Matching Game */
    .dfgame-modal {
      background: #141414; border-radius: 8px;
      width: 100%; max-width: 600px;
      max-height: calc(100vh - 60px); overflow-y: auto;
      position: relative;
    }
    .dfgame-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 44px 12px 20px;
    }
    .dfgame-title { font-size: 18px; font-weight: 700; color: white; }
    .dfgame-stats { display: flex; gap: 20px; }
    .dfgame-stat { font-size: 13px; color: var(--ink-muted); }
    .dfgame-stat strong { color: white; }
    .dfgame-grid {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 6px; padding: 16px 20px 16px;
    }
    .dfgame-grid-fade { opacity: 0; transition: opacity 0.55s ease; pointer-events: none; }
    .dfgame-win-letter {
      font-size: 40px; font-weight: 900; color: white; letter-spacing: -0.02em;
    }
    .dfgame-results {
      display: flex; flex-direction: column; align-items: center;
      gap: 24px; padding: 52px 40px 56px; text-align: center;
      animation: fadeOverlay 0.5s ease;
    }
    .dfgame-result-stats {
      display: flex; gap: 48px;
    }
    .dfgame-result-stat { display: flex; flex-direction: column; gap: 4px; }
    .dfgame-result-value { font-size: 36px; font-weight: 700; color: white; }
    .dfgame-result-label { font-size: 12px; color: var(--ink-muted); letter-spacing: 0.08em; text-transform: uppercase; }
    .dfgame-card { aspect-ratio: 3/4; cursor: pointer; perspective: 600px; }
    .dfgame-card.locked { cursor: default; }
    .dfgame-card-inner {
      width: 100%; height: 100%;
      position: relative; transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
    }
    .dfgame-card.flipped .dfgame-card-inner,
    .dfgame-card.matched .dfgame-card-inner { transform: rotateY(180deg); }
    .dfgame-card-back, .dfgame-card-front {
      position: absolute; inset: 0; border-radius: 6px;
      backface-visibility: hidden; overflow: hidden;
    }
    .dfgame-card-back {
      background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    .dfgame-card-back img {
      width: 100%; height: 100%; object-fit: cover; object-position: center;
    }
    .dfgame-card-front {
      transform: rotateY(180deg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; padding: 10px; border: 2px solid transparent;
    }
    .dfgame-card.matched .dfgame-card-front {
      border-color: #46D369;
      box-shadow: inset 0 0 14px rgba(70,211,105,0.18);
    }
    .dfgame-char-card { background: #111; padding: 0; gap: 0; }
    .dfgame-char-card img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
    .dfgame-char-card.clickable:hover { opacity: 0.88; cursor: pointer; }
    .dfgame-fruit-img { width: 72%; height: 68%; object-fit: contain; }
    .dfgame-fruit-name {
      font-size: 7.5px; font-weight: 600; color: #A3A3A3;
      text-align: center; letter-spacing: 0.04em; line-height: 1.3; text-transform: uppercase;
    }
    .dfgame-win-badge {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, #FFD700, #FF6B00);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; box-shadow: 0 0 40px rgba(255,200,0,0.35);
    }
    .game-eyebrow {
      font-size: 11px; color: var(--red); font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 12px;
    }
    .game-question { font-size: 20px; font-weight: 600; color: white; margin-bottom: 24px; line-height: 1.45; }
    .progress-track { height: 3px; background: #333; border-radius: 2px; margin-bottom: 8px; }

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeGameCards() {
  return shuffleArray(
    DEVIL_FRUITS.flatMap(fruit => [
      { id: `${fruit.id}-fruit`, pairId: fruit.id, type: 'fruit', fruit },
      { id: `${fruit.id}-char`,  pairId: fruit.id, type: 'char',  fruit },
    ])
  );
}

function ImgWithFallback({ src, alt, fallbackBg, fallbackIcon, fallbackTitle, style, className }) {
  const [failed, setFailed] = useState(false);

  if (failed || !src) {
    return (
      <div style={{ ...style, background: fallbackBg || '#2D2D2D', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '12px' }} className={className}>
        {fallbackIcon && <div style={{ fontSize: '32px', marginBottom: '8px' }}>{fallbackIcon}</div>}
        {fallbackTitle && <div style={{ fontSize: '11px', color: 'white', fontWeight: '600', textAlign: 'center', lineHeight: '1.3' }}>{fallbackTitle}</div>}
      </div>
    );
  }

  return (
    <img
      src={src} alt={alt}
      onError={() => setFailed(true)}
      style={style} className={className}
    />
  );
}

function NetflixNav({ activeSection, onNavClick, profileBadge }) {
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    const hero = document.getElementById('home');
    if (!hero) return;
    const obs = new IntersectionObserver(
      ([entry]) => setScrolled(!entry.isIntersecting),
      { threshold: 0.05 }
    );
    obs.observe(hero);
    return () => obs.disconnect();
  }, []);

  const links = [
    { id: 'home', label: 'Home' },
    { id: 'watchlist', label: 'Watchlist' },
    { id: 'characters', label: 'Meet the Crew' },
    { id: 'podcast', label: 'Behind the Live Action' },
    { id: 'games', label: 'Games' },
  ];

  const scrollTo = (id) => {
    document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
    onNavClick(id);
  };

  return (
    <nav id="nav" className={scrolled ? 'scrolled' : 'at-top'}>
      <img
        src="netflix-logo.png"
        alt="Netflix"
        onClick={() => scrollTo('home')}
        style={{ height: '32px', width: 'auto', cursor: 'pointer', flexShrink: 0, display: 'block' }}
      />
      <div className="nav-links">
        {links.map(l => (
          <a
            key={l.id}
            href={`#${l.id}`}
            className={activeSection === l.id ? 'active' : ''}
            onClick={(e) => { e.preventDefault(); scrollTo(l.id); }}
          >
            {l.label}
          </a>
        ))}
      </div>
      <div className="nav-right">
        <svg className="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <div className="nav-avatar" style={{ padding: profileBadge ? 0 : undefined, overflow: profileBadge ? 'hidden' : undefined }}>
          {profileBadge
            ? <img src={profileBadge} alt="profile" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}/>
            : 'G'}
        </div>
      </div>
    </nav>
  );
}

function CollectionWatchlist() {
  const rowRef = useRef(null);
  const [atStart, setAtStart] = useState(true);
  const scroll = (dir) => rowRef.current?.scrollBy({ left: dir * 480, behavior: 'smooth' });

  useEffect(() => {
    const el = rowRef.current;
    if (!el) return;
    const onScroll = () => setAtStart(el.scrollLeft <= 0);
    el.addEventListener('scroll', onScroll);
    return () => el.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <section id="watchlist">
      <h2 className="section-title">Collection Watchlist</h2>
      <div className="watchlist-wrap">
        {!atStart && <button className="arrow-btn arrow-left" onClick={() => scroll(-1)}>&#8249;</button>}

        </div>
        <button className="arrow-btn arrow-right" onClick={() => scroll(1)}>&#8250;</button>
      </div>
    </section>
  );
}

// ─── DEVIL FRUIT GAME COMPONENTS ────────────────────────────────────────────

function CardBack() {
  return <img src="card-back.png" alt=""/>;
}


const WIN_LETTERS = { 6: 'Y', 7: 'O', 8: 'U', 11: 'W', 12: 'I', 13: 'N' };

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m > 0 ? `${m}m ${sec < 10 ? '0' + sec : sec}s` : `${s}s`;
}

function DevilFruitGame({ onClose }) {
  const [cards, setCards] = useState(makeGameCards);
  const [flippedIds, setFlippedIds] = useState([]);
  const [matchedPairs, setMatchedPairs] = useState(new Set());
  const [moves, setMoves] = useState(0);
  const [isChecking, setIsChecking] = useState(false);
  const [winPhase, setWinPhase] = useState(null);
  const [finalTime, setFinalTime] = useState(0);
  const [finalMoves, setFinalMoves] = useState(0);
  const [displayTime, setDisplayTime] = useState(0);
  const [gameChar, setGameChar] = useState(null);
  const startTimeRef = React.useRef(Date.now());

  useEffect(() => {
    const fn = (e) => { if (e.key === 'Escape') { if (gameChar) setGameChar(null); else onClose(); } };
    document.addEventListener('keydown', fn);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', fn); document.body.style.overflow = ''; };
  }, [onClose, gameChar]);

  useEffect(() => {
    if (winPhase !== null) return;
    const id = setInterval(() => {
      setDisplayTime(Math.floor((Date.now() - startTimeRef.current) / 1000));
    }, 1000);
    return () => clearInterval(id);
  }, [winPhase]);

  const handleCardClick = (card) => {
    if (matchedPairs.has(card.pairId) && card.type === 'char') {
      const ch = CHARACTERS.find(c => c.id === card.fruit.charDataKey) || GAME_CHAR_DATA[card.fruit.charDataKey];
      if (ch) setGameChar(ch);
      return;
    }
    if (isChecking || matchedPairs.has(card.pairId) || flippedIds.includes(card.id) || flippedIds.length >= 2) return;

    const next = [...flippedIds, card.id];
    setFlippedIds(next);

    if (next.length === 2) {
      setMoves(m => m + 1);
      const c1 = cards.find(c => c.id === next[0]);
      const c2 = cards.find(c => c.id === next[1]);
      if (c1.pairId === c2.pairId) {
        const newMatched = new Set([...matchedPairs, c1.pairId]);
        setMatchedPairs(newMatched);
        setFlippedIds([]);
        if (newMatched.size === DEVIL_FRUITS.length) {
          const ft = Math.floor((Date.now() - startTimeRef.current) / 1000);
          setFinalTime(ft);
          setFinalMoves(moves + 1);
          setTimeout(() => setWinPhase('show'), 500);
          setTimeout(() => setWinPhase('flipping'), 620);
          setTimeout(() => setWinPhase('fade'), 2100);
          setTimeout(() => setWinPhase('results'), 2680);
        }
      } else {
        setIsChecking(true);
        setTimeout(() => { setFlippedIds([]); setIsChecking(false); }, 850);
      }
    }
  };

  const reset = () => {
    setCards(makeGameCards());
    setFlippedIds([]);
    setMatchedPairs(new Set());
    setMoves(0);
    setIsChecking(false);
    setWinPhase(null);
    setFinalTime(0);
    setFinalMoves(0);
    setDisplayTime(0);
    startTimeRef.current = Date.now();
  };

  return (
    <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="dfgame-modal modal-card" onClick={e => e.stopPropagation()}>
        <button className="close-x" onClick={onClose}>&#x2715;</button>

        {winPhase === 'results' ? (
          <div className="dfgame-results">
            <div className="dfgame-win-badge">⚓</div>
            <h2 style={{ fontSize: '28px', fontWeight: 700, color: 'white', margin: 0 }}>Grand Line Achieved!</h2>
            <div className="dfgame-result-stats">
              <div className="dfgame-result-stat">
                <div className="dfgame-result-value">{formatTime(finalTime)}</div>
                <div className="dfgame-result-label">Time</div>
              </div>
              <div className="dfgame-result-stat">
                <div className="dfgame-result-value">{finalMoves}</div>
                <div className="dfgame-result-label">Moves</div>
              </div>
            </div>
            <button className="btn-play" onClick={reset}>
              <svg width="14" height="16" viewBox="0 0 21 24" fill="none"><path d="M19.4951 11.5876C20.1603 11.9831 20.1436 12.9519 19.465 13.324L1.48089 23.1878C0.81446 23.5533 6.94647e-07 23.0711 6.71762e-07 22.311L5.29227e-08 1.7577C2.95747e-08 0.982254 0.844358 0.501877 1.51094 0.898088L19.4951 11.5876Z" fill="black"/></svg>
              Play Again
            </button>
          </div>
        ) : (winPhase === 'show' || winPhase === 'flipping' || winPhase === 'fade') ? (
          <div className={`dfgame-grid${winPhase === 'fade' ? ' dfgame-grid-fade' : ''}`}>
            {Array.from({ length: 20 }, (_, i) => {
              const letter = WIN_LETTERS[i];
              const isFlipped = winPhase === 'flipping' || winPhase === 'fade';
              return (
                <div key={i} className={`dfgame-card${isFlipped ? ' flipped' : ''}`}>
                  <div className="dfgame-card-inner" style={{ transitionDelay: isFlipped ? `${i * 38}ms` : '0ms' }}>
                    <div className="dfgame-card-back"><CardBack/></div>
                    <div className="dfgame-card-front" style={{ background: '#000', padding: 0 }}>
                      {letter && <span className="dfgame-win-letter">{letter}</span>}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        ) : (
          <>
            <div className="dfgame-header">
              <div className="dfgame-title">Devil Fruit Matching</div>
              <div className="dfgame-stats">
                <span className="dfgame-stat">Matches <strong>{matchedPairs.size}/{DEVIL_FRUITS.length}</strong></span>
                <span className="dfgame-stat">Moves <strong>{moves}</strong></span>
                <span className="dfgame-stat">Time <strong>{formatTime(displayTime)}</strong></span>
              </div>
            </div>
            <div className="dfgame-grid">
              {cards.map(card => {
                const flipped = flippedIds.includes(card.id) || matchedPairs.has(card.pairId);
                const matched = matchedPairs.has(card.pairId);
                return (
                  <div key={card.id}
                    className={`dfgame-card${flipped ? ' flipped' : ''}${matched ? ' matched locked' : ''}`}
                    onClick={() => handleCardClick(card)}>
                    <div className="dfgame-card-inner">
                      <div className="dfgame-card-back"><CardBack/></div>
                      <div className={`dfgame-card-front${card.type === 'char' ? ' dfgame-char-card' : ''}`}
                           style={card.type === 'fruit' ? { background: '#1A1A1A' } : {}}>
                        {card.type === 'fruit' ? (
                          <>
                            <img src={card.fruit.img} alt={card.fruit.fruitName} className="dfgame-fruit-img"/>
                            <div className="dfgame-fruit-name">{card.fruit.fruitName}</div>
                          </>
                        ) : (
                          <img src={card.fruit.charImg} alt={card.fruit.charName}/>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      {gameChar && <CharacterModal character={gameChar} onClose={() => setGameChar(null)}/>}
    </div>
  );
}

function QuizModal({ onClose, onBadgeAdd }) {
  const [step, setStep] = useState(0);
  const [tally, setTally] = useState({});
  const [chosen, setChosen] = useState(null);
  const [result, setResult] = useState(null);
  const [badgeAdded, setBadgeAdded] = useState(false);

  useEffect(() => {
    const fn = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', fn);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', fn); document.body.style.overflow = ''; };
  }, [onClose]);

  const pick = (opt) => {
    if (chosen) return;
    setChosen(opt.character);
    const next = { ...tally, [opt.character]: (tally[opt.character] || 0) + 1 };
    setTally(next);
    setTimeout(() => {
      setChosen(null);
      if (step < QUIZ_QUESTIONS.length - 1) {
        setStep(s => s + 1);
      } else {
        const winner = Object.entries(next).sort((a, b) => b[1] - a[1])[0][0];
        setResult(winner);
      }
    }, 380);
  };

  const reset = () => { setStep(0); setTally({}); setChosen(null); setResult(null); setBadgeAdded(false); };
  const q = QUIZ_QUESTIONS[step];
  const progress = (step / QUIZ_QUESTIONS.length) * 100;
  const res = result ? CHARACTER_RESULTS[result] : null;
  const resChar = result ? CHARACTERS.find(c => c.id === result) : null;

  return (
    <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="game-modal modal-card" onClick={e => e.stopPropagation()}>
        <button className="close-x" onClick={onClose}>&#x2715;</button>

        {result ? (
          <div className="result-screen">
            <div className="result-portrait" style={{ borderColor: res.color }}>
              <ImgWithFallback
                src={res.portrait}
                alt={res.name}
                fallbackBg="#2D2D2D"
                fallbackIcon="☠"
                style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}
              />
            </div>
            <h2>{res.name}</h2>
            <div className="result-tags">
              {res.tags.map(tag => <span key={tag} className="result-tag">{tag}</span>)}
            </div>
            <p className="result-desc">{res.desc}</p>
            <div style={{ display: 'flex', gap: '12px', marginBottom: '4px' }}>
              <button
                className={`result-badge-btn${badgeAdded ? ' badge-added' : ''}`}
                style={{ marginBottom: 0, flex: 1 }}
                onClick={() => { setBadgeAdded(true); if (res.portrait) onBadgeAdd?.(res.portrait); }}
                disabled={badgeAdded}
              >
                <span className="badge-icon-wrap">
                  <span className="badge-icon-plus">+</span>
                  <span className="badge-icon-check">✓</span>
                </span>
                {badgeAdded ? 'Badge Added' : 'Add Badge'}
              </button>
              <button
                className="btn-play"
                onClick={reset}
                style={{ flex: 1, background: 'transparent', color: 'var(--ink-muted)', border: '1px solid rgba(255,255,255,0.2)', fontSize: '14px', padding: '10px 20px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}
              >Try Again</button>
            </div>
          </div>
        ) : (
          <>
            <div className="progress-track" style={{ marginTop: '24px' }}><div className="progress-fill" style={{ width: `${progress}%` }}/></div>
            <div className="progress-meta">
              <span>{step + 1} of {QUIZ_QUESTIONS.length}</span>
            </div>
            <div className="game-question">{q.question}</div>
            <div className="options-list">
              {q.options.map((opt, i) => (
                <button
                  key={i}
                  className={`opt-btn${chosen === opt.character ? ' chosen' : ''}`}
                  onClick={() => pick(opt)}
                  disabled={!!chosen}
                >
                  {opt.text}
                </button>
              ))}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function TriviaModal({ onClose }) {
  const [step, setStep] = useState(0);
  const [chosen, setChosen] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);

  useEffect(() => {
    const fn = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', fn);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', fn); document.body.style.overflow = ''; };
  }, [onClose]);

  const pick = (idx) => {
    if (chosen !== null) return;
    setChosen(idx);
    if (idx === TRIVIA_QUESTIONS[step].answer) setScore(s => s + 1);
    setTimeout(() => {
      setChosen(null);
      if (step < TRIVIA_QUESTIONS.length - 1) setStep(s => s + 1);
      else setDone(true);
    }, 2200);
  };

  const reset = () => { setStep(0); setChosen(null); setScore(0); setDone(false); };
  const q = TRIVIA_QUESTIONS[step];
  const progress = (step / TRIVIA_QUESTIONS.length) * 100;

  return (
    <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="game-modal modal-card" onClick={e => e.stopPropagation()}>
        <button className="close-x" onClick={onClose}>&#x2715;</button>

        {done ? (
          <div className="result-screen">
            <div className="result-score">{score} / {TRIVIA_QUESTIONS.length}</div>
            <p className="result-msg">
              {score >= 5
                ? 'You belong on the Grand Line. Gol D. Roger himself would be impressed.'
                : score >= 3
                ? 'A solid sailor. Keep reading the Log Poses.'
                : 'The sea will humble you. Hit the books before your next voyage.'}
            </p>
            <div className="btn-center">
              <button className="btn-play" onClick={reset}>Try Again</button>
            </div>
          </div>
        ) : (
          <>
            <div className="progress-track"><div className="progress-fill" style={{ width: `${progress}%` }}/></div>
            <div className="progress-meta">
              <span>Question {step + 1} of {TRIVIA_QUESTIONS.length}</span>
              <span className="score">Score: {score}</span>
            </div>
            <div className="game-eyebrow">One Piece Trivia</div>
            <div className="game-question">{q.q}</div>
            <div className="options-list">
              {q.opts.map((opt, i) => {
                let cls = 'opt-btn';
                if (chosen !== null) {
                  cls += ' revealed';
                  if (i === q.answer) cls += ' correct';
                  else if (chosen === i) cls += ' wrong';
                }
                return (
                  <button key={i} className={cls} onClick={() => pick(i)} disabled={chosen !== null}>
                    {opt}
                  </button>
                );
              })}
            </div>
            {chosen !== null && (
              <div className="fact-box" style={{ borderLeft: `3px solid ${chosen === q.answer ? '#46D369' : '#E50914'}` }}>
                {q.fact}
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function App() {
  const [activeSection, setActiveSection] = useState('home');
  const [selectedChar, setSelectedChar] = useState(null);
  const [activeModal, setActiveModal] = useState(null);
  const [protoToast, setProtoToast] = useState(false);
  const [profileBadge, setProfileBadge] = useState(null);

  useEffect(() => {
    if (!protoToast) return;
    const id = setTimeout(() => setProtoToast(false), 3000);
    return () => clearTimeout(id);
  }, [protoToast]);

  useEffect(() => {
    const sections = ['home', 'watchlist', 'characters', 'podcast', 'games'];
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) setActiveSection(entry.target.id);
        });
      },
      { threshold: 0.25 }
    );
    sections.forEach(id => {
      const el = document.getElementById(id);
      if (el) obs.observe(el);
    });
    return () => obs.disconnect();
  }, []);

  return (
    <>
      <NetflixNav activeSection={activeSection} onNavClick={setActiveSection} profileBadge={profileBadge}/>
      <main>
        <HeroBillboard/>
        <CollectionWatchlist/>
        <MeetTheCrew onCharacterClick={(char) => {
          if (char.id === 'luffy') setSelectedChar(char);
          else setProtoToast(true);
        }}/>
        <BehindTheVoyage/>
        <NetflixGames
          onQuizOpen={() => setActiveModal('quiz')}
          onDevilFruitOpen={() => setActiveModal('devilFruit')}
        />
      </main>
      <SiteFooter/>

      {selectedChar && (
        <CharacterModal character={selectedChar} onClose={() => setSelectedChar(null)}/>
      )}
      {protoToast && (
        <div className="proto-toast">This interaction is not available for this prototype.</div>
      )}
      {activeModal === 'quiz' && (
        <QuizModal onClose={() => setActiveModal(null)} onBadgeAdd={setProfileBadge}/>
      )}
      {activeModal === 'devilFruit' && (
        <DevilFruitGame onClose={() => setActiveModal(null)}/>
      )}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
